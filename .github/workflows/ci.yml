name: CI Data Pipeline & ML Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Lint, Test & Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Code Quality & Syntax Linting (Flake8)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length 120
          flake8 src tests --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

      - name: Run Test Suite (Pytest)
        run: |
          pytest -v --durations=10

      - name: Verify Part C Feed Experiment Runs
        run: |
          python -m src.feed_experiment
          python -m src.feed_ranker
